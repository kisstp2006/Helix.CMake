name: dotnet

on:
  workflow_call:
    inputs:
      project:
        type: string
        required: true
      test-project:
        type: string
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - run: dotnet build ${{ inputs.project }} -c Release
      - if: inputs.test-project != ''
        run: dotnet run --project ${{ inputs.test-project }} -c Release
