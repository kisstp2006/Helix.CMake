name: build

on:
  workflow_call:
    inputs:
      run-tests:
        type: boolean
        default: true
      # Installs the .NET SDK on every job, for repositories that build C# code as part of the CMake build.
      dotnet:
        type: boolean
        default: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - if: inputs.dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Build and test
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake --preset windows-${{ matrix.config }} || exit /b 1
          cmake --build --preset windows-${{ matrix.config }} || exit /b 1
          if "${{ inputs.run-tests }}"=="true" ctest --preset windows-${{ matrix.config }} -V || exit /b 1

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - if: inputs.dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y ninja-build clang libx11-dev xvfb libegl1 libegl-mesa0 libgl1-mesa-dri libopengl0 libgles2
      - run: cmake --preset linux-${{ matrix.config }}
      - run: cmake --build --preset linux-${{ matrix.config }}
      - if: inputs.run-tests
        run: xvfb-run -a ctest --preset linux-${{ matrix.config }} -V

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - if: inputs.dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y ninja-build
      - run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cmake --preset android-arm64-release
      - run: cmake --build --preset android-arm64-release

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - run: dotnet workload install wasm-tools
      - timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y ninja-build
      - run: cmake --preset web-release
      - run: cmake --build --preset web-release
      - if: inputs.run-tests
        run: ctest --preset web-release -V
